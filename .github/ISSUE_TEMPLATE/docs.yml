name: Documentation Improvement
description: Suggest an improvement, clarification, or fix for GitVerse documentation.
labels: [documentation, good first issue]
body:
  - type: textarea
    id: description
    attributes:
      label: Documentation Issue Description
      description: What section or document needs improvement?
      placeholder: E.g., The Windows setup guide needs additional notes on execution policies.
    validations:
      required: true
  - type: textarea
    id: suggested-change
    attributes:
      label: Suggested Change
      description: What should the documentation say instead?
    validations:
      required: true

